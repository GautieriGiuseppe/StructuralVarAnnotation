name: Build and Push needLR Container

on:
  push:
    branches:
      - main
      - survivor-genotyping
    paths:
      - 'variant_calling/container/**'
      - '.github/workflows/build-needlr-container.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: gautierigiuseppe/needlr
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=survivor-genotyping,enable=${{ github.ref_name == 'survivor-genotyping' }}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./variant_calling/container
          file: ./variant_calling/container/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
